[project]
name = "realsense-face-id"
version = "0.1.0"
description = "Face-ID authentication and anti-spoofing on an Intel RealSense D435"
readme = "README.md"
authors = [
    { name = "alanfrancis442", email = "alan.prime567@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pyrealsense2>=2.58.4.10922",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
# Only for face.adaface_export, which turns the AdaFace PyTorch weights into ONNX once.
# CUDA build so step 7 training can reuse it; the export itself runs on the CPU.
export = [
    "onnx",
    "safetensors",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
