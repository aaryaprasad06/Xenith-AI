# auto_exposure_limit_us stops the IR image clipping to white on a close wall.
# Without it the laser-on frame saturates and the center distance stays n/a.
# blur_min (Laplacian variance of the IR face crop) is left unset, so the blur
# check is off: on this D435 it did not separate sharp from blurred faces
# (journal, 2026-10-18). Measure with `python -m liveness.tune_blur`.
# rgb adds the colour camera, mapped into the IR viewport (Frame.rgb).
camera: {width: 848, height: 480, fps: 30, depth_units: 0.0001, auto_exposure_limit_us: 3000, rgb: true}
quality: {min_dist_m: 0.10, max_dist_m: 0.60, min_face_px: 80, max_hole_frac: 0.2}
liveness: {relief_min_m: 0.015, relief_max_m: 0.08, flat_max_m: 0.005, nose_cheek_min_m: 0.008, model_threshold: 0.5, frames_required: 5}
match: {threshold: 0.45, unknown_label: "unknown"}
door: {gpio_pin: 17, unlock_seconds: 5, max_failures: 5, cooldown_seconds: 60}

# Capture-only settings (not in the PRD block above). The filter chain order is
# fixed in capture/filters.py; only parameters live here.
filters:
  decimation: {enabled: true, magnitude: 1}
  spatial: {magnitude: 2, smooth_alpha: 0.5, smooth_delta: 20, holes_fill: 0}
  temporal: {smooth_alpha: 0.4, smooth_delta: 20, persistency: 3}
  hole_filling: {mode: 1}

emitter:
  alternate: true

preview:
  center_box_frac: 0.1

# Guided recording on the console's Record page (enroll/guide.py). Head turns
# are degrees from face/pose.py (depth at the eyes and mouth corners), measured
# from the person's own straight-ahead pose. A turn counts for a direction when
# it reaches the ellipse reach_yaw_deg × reach_pitch_deg. Starting values.
guide:
  center_max_deg: 6
  reach_yaw_deg: 18
  reach_pitch_deg: 12
  pairs_per_pose: 6
  ticks: 48
  timeout_s: 180
